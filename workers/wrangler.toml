# Copy to wrangler.toml after creating resources in the campaign-owned Cloudflare account.
# This file is safe to commit. Keep API keys and all other secrets in Cloudflare Secrets,
# never in wrangler.toml or .dev.vars committed to Git.

name = "sodangi-2027"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[vars]
ENVIRONMENT = "production"
SITE_ORIGIN = "https://sodangi-2027.pages.dev"

# ACCESS_TEAM_DOMAIN and ACCESS_AUD can be configured here;
# secrets should be stored in the Cloudflare dashboard.

[[d1_databases]]
binding = "DB"
database_name = "sodangi-cms"
database_id = "e0a9b2f2-77f9-4119-a8b7-167384f8d0c5"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sodangi-media"

name = "sodangi-facebook-sync"
main = "facebook-sync.ts"
compatibility_date = "2026-11-01"
[triggers]
crons = ["*/15 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "sodangi-cms"
database_id = "d3b20826742de95a7c7239639320a2d9"
# The Page ID, public Page URL, publication mode and cadence are configured in
# the protected website admin dashboard. Store only the Meta token as a Worker
# secret: npx wrangler secret put FB_PAGE_ACCESS_TOKEN --config workers/wrangler.toml
