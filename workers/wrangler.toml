# Dedicated scheduled Facebook Page synchronisation Worker.
# This file must NOT contain the Pages project configuration.
# The D1 ID matches the DB binding in the root ../wrangler.toml.
name = "sodangi-facebook-sync"
main = "facebook-sync.ts"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sodangi-cms"
database_id = "e0a9b2f2-77f9-4119-a8b7-167384f8d0c5"

# Keep the actual Page token in a Worker Secret, never in this file:
# npx wrangler secret put FB_PAGE_ACCESS_TOKEN --config workers/wrangler.toml
# The Page ID, Page URL, editorial review mode, and sync frequency are
# managed in /admin -> Integrations and stored in the shared D1 database.
